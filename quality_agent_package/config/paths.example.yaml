# Относительные пути разрешаются относительно этого YAML-файла.
# Абсолютные пути Windows тоже поддерживаются.
sources:
  telemetry_path: ../raw/242000_tags.csv
  avt_telemetry_path: ../raw/avt_tags.csv
  lims_path: ../raw/ЛИМСы 01.01.2023 - н.в_ (2).xlsx

  # Для текущего инференса серы ПАК не нужен.
  # Если указать путь, файл будет только загружен парсером для контроля доступности.
  pak_path: null

  # Если указан prepared_path, сборка base_state идет из уже подготовленного parquet,
  # а большие CSV/XLSX не читаются.
  prepared_path: null
