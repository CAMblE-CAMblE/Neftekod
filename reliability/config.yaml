# Конфиг агента надёжности. Все пороги — допущения из истории, не паспорт.

data:
  u242_csv: "data/242000_tags.csv"        # телеметрия гидроочистки 24-2000
  avt_csv: "data/avt_tags.csv"            # телеметрия АВТ
  cache_dir: ".cache"                     # parquet-кэш
  step_minutes: 10                        # шаг ряда

# Теги, по которым оцениваем РИСК (24-2000). Физика — из офиц. таблицы «теги АВТ_24-2000.xlsx».
risk_tags:
  reactor_temp: ["T11", "T5", "T6"]       # T11=ГСС на выходе Р-202 (WABT), T5=выход Р-201, T6=вход Р-202; °C, ~365, при останове ~0
  feed_flow: ["F9", "F15"]                # F9=сырьё массовое т/ч, F15=сырьё объёмное м³/ч (при останове ~0)
  reactor_dp: ["P8"]                      # P8=перепад давления реактора Р-202, МПа (загрязнение/коксование слоя)
  makeup_gas: ["W7", "F22", "F25"]        # W7=газ поддува масс. т/ч, F22=газ поддува об. нм³/ч, F25=свежий ВСГ нм³/ч
  sulfur_out: ["Q21"]                     # сера ГОДТ на выходе, ppm (≈ ПАК; 307 — выброс, чистить)
  sulfur_feed: ["Q20"]                    # сера сырья на входе, ppm (плотный ряд, ~7900) — нагрузка на катализатор

# Детектор состояния установки (Блок A)
state_detector:
  # останов: температура реактора ниже доли от рабочей медианы ИЛИ расход около нуля
  shutdown_temp_frac: 0.5                 # T_reactor < 0.5 * рабочая медиана -> останов
  shutdown_feed_frac: 0.1                 # feed < 0.1 * рабочая медиана -> останов
  # пуск: величины ниже рабочей полки, но растут
  transient_z: 3.0                        # |скорость дрейфа| в единицах роб. σ -> переходный режим
  drift_window: 6                         # окно для скорости дрейфа (6*10мин = 1ч)
  steady_min_run: 18                      # гистерезис: сколько последних точек смотрим на устойчивость простоя (3ч)
  smooth_k: 3                             # текущее значение = медиана последних k точек (гасит всплески)

# Индекс тяжести (Блок B)
severity:
  window_steady: 4320                     # окно для «рабочих» перцентилей (30 дней * 144)
  approach_hi_pctl: 99                    # верхний перцентиль как мягкий предел
  approach_lo_pctl: 1
  catalyst_trend_window: 20160            # окно тренда WABT (140 дней) — деградация катализатора
  catalyst:                              # прокси деградации катализатора по сере
    target_sulfur_ppm: 9.0               # целевой уровень серы, у которого смотрим нужную температуру
    sulfur_band_ppm: 2.5                 # берём точки, где сера в [target±band] («держим у спеки»)
    sulfur_outlier_ppm: 40.0             # серу выше этого считаем выбросом (Q21=307 и т.п.), выкидываем
    ref_deg_per_month: 3.0               # рост WABT ~3°C/мес = полный риск (score=1)
  weights:                               # веса факторов в risk_index (нормируются)
    temp_approach: 0.30
    catalyst_trend: 0.25
    reactor_dp: 0.20
    gas_feed_ratio: 0.15
    drift: 0.10
  class_thresholds:                      # risk_index -> risk_class
    low: 0.33
    medium: 0.66

# Коридоры для оптимизатора (Блок C). Считаются только по steady-периодам.
constraints:
  lo_pctl: 1
  hi_pctl: 99
  tighten_on_high_risk: 0.5              # при high risk сузить коридор к медиане на 50%
  # Управляемые теги = помечены "У" (управляемый) на схеме Ustanovka_AVT_merged.pdf.
  # Маппинг каноничное имя со схемы -> тег CSV (по физике из «теги АВТ_24-2000.xlsx»):
  #   ht_inlet_temp_c      -> T6   (темп ГСС на входе Р-202)
  #   ht_feed_flow_mass    -> F9   (расход сырья массовый, т/ч) — управляющий в симуляторе команды
  #   ht_feed_flow_m3h     -> F15  (расход сырья объёмный)
  #   ht_pressure_mpa      -> P13  (давление входа реактора)
  #   ht_gas_oil_ratio     -> F25  (свежий ВСГ; отношение к сырью)
  # Симулятор команды перебирает кандидатов по T6/F9/P13 -> держим их коридоры (F9 добавлен к F15).
  control_tags_u242: ["T6", "F9", "F15", "P13", "F25"]
  # АВТ, "У" на схеме: T печи + P колонны (+ верх колонны).
  #   avt_furnace_outlet_temp_c -> T55, avt_column_pressure -> P2, avt_column_top_temp_c -> T1
  # ОТЛОЖЕНО: коридоры АВТ считаются только при include_avt=true И переданной телеметрии АВТ.
  # Имена тегов пересекаются с 24-2000 (T6, F25) -> ключи неймспейсятся как "AVT:<tag>".
  include_avt: false
  control_tags_avt: ["T55", "P2", "T1"]
